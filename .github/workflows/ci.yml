name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Architecture dependency gate
        run: npm run test:architecture

      - name: Critical simulation and persistence coverage gate
        run: npm run test:coverage:critical

      - name: Long-save retention coverage gate
        run: npm run test:coverage:retention

      - name: Replayability divergence gate
        run: npm run test:replayability

      - name: Build (Next.js static export)
        run: npm run build

      - name: Upload replayability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replayability-divergence-evidence
          path: artifacts/replayability/release-summary.json
          if-no-files-found: ignore
          retention-days: 30
