name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Use pinned npm toolchain
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund

      - run: npm ci

      - name: Real child and file worker output checks
        id: worker-output
        run: npm run test:worker-output-relay

      - name: Upload worker output evidence
        if: ${{ always() && (steps.worker-output.outcome == 'success' || steps.worker-output.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-output-relay-evidence
          path: artifacts/release/generated/worker-output-relay-e2e-*/
          if-no-files-found: error
          retention-days: 30

      - name: Installed reviewed Braces regression
        id: braces-depth-guard
        run: npm run test:braces-depth-guard

      - name: Upload Braces regression evidence
        if: ${{ always() && (steps.braces-depth-guard.outcome == 'success' || steps.braces-depth-guard.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: braces-depth-guard-evidence
          path: artifacts/release/generated/braces-depth-guard-e2e-*/
          if-no-files-found: error
          retention-days: 30
      - name: Installed HTTP cache policy real-consumer regression
        id: http-cache-policy
        run: npm run test:http-cache-policy

      - name: Upload HTTP cache policy regression evidence
        if: ${{ always() && (steps.http-cache-policy.outcome == 'success' || steps.http-cache-policy.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-cache-policy-evidence
          path: artifacts/release/generated/http-cache-policy-e2e-*/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Architecture dependency gate
        run: npm run test:architecture

      - name: Accepted-source soak staging contract
        run: npm run test:accepted-soak-staging

      - name: Windows installer input contract
        run: npm run test:windows-installer-inputs

      - name: Critical simulation and persistence coverage gate
        run: npm run test:coverage:critical

      - name: Long-save retention coverage gate
        run: npm run test:coverage:retention

      - name: Replayability divergence gate
        run: npm run test:replayability

      - name: Build (Next.js static export)
        run: npm run build

      - name: Upload replayability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replayability-divergence-evidence
          path: artifacts/release/generated/replayability-release-summary.json
          if-no-files-found: error
          retention-days: 30
