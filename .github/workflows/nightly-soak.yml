name: Nightly Simulation Soak

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-simulation-soak
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_BUILD_VERSION: ${{ github.sha }}

jobs:
  browser-regression:
    name: Full Chromium browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e

      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-browser-regression-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

  simulation-soak:
    name: Canonical full-week long-career soaks
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Run isolated 20-seed x 30-season profile
        env:
          SOAK_SEEDS: "20"
          SOAK_SEASONS: "30"
          SOAK_CONCURRENCY: "3"
          SOAK_CANDIDATE_SHA: ${{ github.sha }}
          SOAK_REQUIRE_CLEAN_CANDIDATE: "true"
        run: npm run test:release-soak
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e:soak
      - run: npm run test:replayability:nightly

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-soak-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/soak/
            artifacts/release/generated/long-career-release-summary.json
            artifacts/release/generated/long-career-workers/
            artifacts/replayability/nightly-summary.json
          if-no-files-found: ignore
          retention-days: 30
