name: Certify and Promote Existing Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Package Accepted Candidate run that produced the exact immutable candidate bundle"
        required: true
        type: string
      candidate_tag:
        description: "Existing candidate tag, for example v1.0.0-rc.1 or v1.0.0"
        required: true
        type: string
      certification_ref:
        description: "Branch or commit containing release-certifications/<candidate-tag>/"
        required: true
        type: string
      publish_github:
        description: "Create or update a draft GitHub release after certification"
        required: true
        default: false
        type: boolean
      publish_steam:
        description: "Upload exact depots to Steam (final non-prerelease tags only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: certify-${{ inputs.candidate_tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  certify:
    name: Certify immutable candidate artifacts
    runs-on: ubuntu-latest
    environment: release-certification
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PUBLISH_STEAM: ${{ inputs.publish_steam }}
        run: |
          if ! printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_run_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::candidate_tag is not a supported release tag"
            exit 1
          fi
          if [ "$PUBLISH_STEAM" = "true" ] && printf '%s' "$CANDIDATE_TAG" | grep -q -- '-'; then
            echo "::error::Prerelease/RC tags can never be uploaded to Steam"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Resolve immutable candidate
        id: candidate
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          sha="$(git -C candidate rev-parse HEAD)"
          tagged_sha="$(git -C candidate rev-parse "${CANDIDATE_TAG}^{commit}")"
          if [ "$sha" != "$tagged_sha" ]; then
            echo "::error::Checked-out candidate does not match its tag"
            exit 1
          fi
          if printf '%s' "$CANDIDATE_TAG" | grep -q -- '-'; then prerelease=true; else prerelease=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"

      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-candidate-bundle
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate accepted bundle identity and install immutable evidence
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          metadata_path="bundle/artifacts/release/generated/accepted-candidate.json"
          if [ ! -f "$metadata_path" ]; then
            echo "::error::Accepted candidate metadata is missing: $metadata_path"
            exit 1
          fi
          expected_sha="$(node -e 'const fs=require("fs"); const metadata=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(metadata.candidateCommitSha ?? ""));' "$metadata_path")"
          expected_tree="$(node -e 'const fs=require("fs"); const metadata=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(metadata.candidateTreeSha ?? ""));' "$metadata_path")"
          expected_tag="$(node -e 'const fs=require("fs"); const metadata=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(metadata.candidateTag ?? ""));' "$metadata_path")"
          actual_sha="$(git -C candidate rev-parse HEAD)"
          actual_tree="$(git -C candidate rev-parse HEAD^{tree})"
          if [ "$expected_sha" != "$actual_sha" ]; then
            echo "::error::Accepted bundle SHA $expected_sha does not match candidate checkout $actual_sha"
            exit 1
          fi
          if [ "$expected_tree" != "$actual_tree" ]; then
            echo "::error::Accepted bundle tree $expected_tree does not match candidate checkout $actual_tree"
            exit 1
          fi
          if [ "$expected_tag" != "$CANDIDATE_TAG" ]; then
            echo "::error::Accepted bundle tag $expected_tag does not match input $CANDIDATE_TAG"
            exit 1
          fi
          cp -R bundle/. candidate/

      - name: Checkout independent certification evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.certification_ref }}
          path: certification-source
          fetch-depth: 1

      - name: Install candidate-bound certification bundle
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          source_dir="certification-source/release-certifications/$CANDIDATE_TAG"
          if [ ! -d "$source_dir" ]; then
            echo "::error::Certification directory is missing: $source_dir"
            exit 1
          fi
          if find "$source_dir" -type l -print -quit | grep -q .; then
            echo "::error::Certification bundles may not contain symbolic links"
            exit 1
          fi
          mkdir -p candidate/artifacts/release/generated/certifications
          cp -R "$source_dir/." candidate/artifacts/release/generated/certifications/
          rm -rf certification-source

      - name: Enforce exact package, core, human, hardware, and platform evidence from control policy
        env:
          RELEASE_WORKFLOW_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_EVIDENCE_STATUS: ../docs/release/release-evidence-status.json
        working-directory: candidate
        run: node ../scripts/check-release-evidence.mjs

      - name: Upload certification decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certified-candidate-${{ inputs.candidate_tag }}
          path: candidate/artifacts/release/release-evidence-check.json
          if-no-files-found: ignore
          retention-days: 90

  github-release:
    name: Draft GitHub release from certified bytes
    needs: certify
    if: inputs.publish_github == true
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-candidate-bundle
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage promotion files from the accepted candidate bundle
        id: promotion
        env:
          CANDIDATE_SHA: ${{ needs.certify.outputs.candidate_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          promotion_list="bundle/artifacts/release/promotion-files.txt"
          if [ ! -f "$promotion_list" ]; then
            echo "::error::Accepted candidate bundle is missing artifacts/release/promotion-files.txt"
            exit 1
          fi
          mkdir -p release-artifacts
          : > release-artifacts/promotion-files.txt
          while IFS= read -r relative_path; do
            [ -n "$relative_path" ] || continue
            source_path="bundle/${relative_path}"
            if [ ! -f "$source_path" ]; then
              echo "::error::Promotion file is missing from the accepted bundle: $relative_path"
              exit 1
            fi
            target_path="release-artifacts/$(basename "$relative_path")"
            cp "$source_path" "$target_path"
            printf '%s\n' "$target_path" >> release-artifacts/promotion-files.txt
          done < "$promotion_list"
          node -e 'const fs=require("fs"); fs.writeFileSync("release-artifacts/build-manifest.json", JSON.stringify({product:"TalentScout",tag:process.env.CANDIDATE_TAG,commit:process.env.CANDIDATE_SHA,candidateWorkflowRun:process.env.CANDIDATE_RUN_ID,certificationWorkflowRun:process.env.GITHUB_RUN_ID,promotedAt:new Date().toISOString()}, null, 2)+"\n")'
          printf '%s\n' release-artifacts/build-manifest.json >> release-artifacts/promotion-files.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            sha256sum "$path"
          done < release-artifacts/promotion-files.txt > release-artifacts/SHA256SUMS.txt
          printf '%s\n' release-artifacts/SHA256SUMS.txt >> release-artifacts/promotion-files.txt
          {
            echo "files<<EOF"
            cat release-artifacts/promotion-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ inputs.candidate_tag }}
          draft: true
          prerelease: ${{ needs.certify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.promotion.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  steam-upload:
    name: Upload certified final depots to Steam
    needs: certify
    if: inputs.publish_steam == true && needs.certify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}

      - name: Download exact Windows depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-windows
          path: dist/win-unpacked
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact macOS depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-macos
          path: steam-stage/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact Linux depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-linux
          path: dist/linux-unpacked
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SteamCmd
        run: |
          sudo apt-get update
          sudo apt-get install -y steamcmd

      - name: Configure Steam authentication
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "$STEAM_CONFIG_VDF" ]; then
            echo "::error::STEAM_CONFIG_VDF is required"
            exit 1
          fi
          mkdir -p "$HOME/.steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/.steam/config/config.vdf"

      - name: Upload unchanged certified depots
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          if [ -z "$STEAM_USERNAME" ]; then
            echo "::error::STEAM_USERNAME is required"
            exit 1
          fi
          steamcmd +login "$STEAM_USERNAME" \
            +run_app_build "$GITHUB_WORKSPACE/steamcmd/app_build_4455570.vdf" \
            +quit
