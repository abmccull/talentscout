name: Certify and Promote Existing Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Package Accepted Candidate run that produced the exact immutable candidate bundle"
        required: true
        type: string
      candidate_tag:
        description: "Existing candidate tag, for example v1.0.0-rc.1 or v1.0.0"
        required: true
        type: string
      certification_ref:
        description: "Branch or commit containing release-certifications/<candidate-tag>/"
        required: true
        type: string
      publish_github:
        description: "Create or update a draft GitHub release after certification"
        required: true
        default: false
        type: boolean
      publish_steam:
        description: "Upload exact depots to Steam (final non-prerelease tags only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: certify-${{ inputs.candidate_tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CANONICAL_CONTROL_BRANCH: release/youth-ea-rc2

jobs:
  certify:
    name: Certify immutable candidate artifacts
    runs-on: ubuntu-latest
    environment: release-certification
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      candidate_tree_sha: ${{ steps.candidate.outputs.tree_sha }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      - name: Validate dispatch inputs and control-plane guardrails
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PUBLISH_STEAM: ${{ inputs.publish_steam }}
          CANONICAL_CONTROL_BRANCH: ${{ env.CANONICAL_CONTROL_BRANCH }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "::error::certify-release must run from the canonical control branch"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "${CANONICAL_CONTROL_BRANCH}" ]; then
            echo "::error::certify-release only runs from ${CANONICAL_CONTROL_BRANCH}, not ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_run_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::candidate_tag is not a supported release tag"
            exit 1
          fi
          if [ "$PUBLISH_STEAM" = "true" ] && printf '%s' "$CANDIDATE_TAG" | grep -q -- '-'; then
            echo "::error::Prerelease/RC tags can never be uploaded to Steam"
            exit 1
          fi
          echo "::notice::This workflow never creates or pushes ${CANDIDATE_TAG}. Pushing any v* tag still triggers legacy build.yml, including the 20x30 soak."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-candidate-bundle
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read accepted bundle metadata
        id: bundle_metadata
        env:
          INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANONICAL_CONTROL_BRANCH: ${{ env.CANONICAL_CONTROL_BRANCH }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const metadataPath = path.resolve("bundle", "artifacts", "release", "generated", "accepted-candidate.json");
          if (!fs.existsSync(metadataPath)) {
            throw new Error(`Accepted candidate metadata is missing: ${metadataPath}`);
          }
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          if (String(metadata.packageWorkflowRunId ?? "") !== process.env.INPUT_CANDIDATE_RUN_ID) {
            throw new Error("accepted bundle packageWorkflowRunId does not match candidate_run_id");
          }
          if (String(metadata.candidateTag ?? "") !== process.env.INPUT_CANDIDATE_TAG) {
            throw new Error("accepted bundle candidateTag does not match the requested candidate_tag");
          }
          if (String(metadata.controlWorkflowSha ?? "") !== process.env.GITHUB_SHA) {
            throw new Error("accepted bundle controlWorkflowSha does not match the current certification control SHA");
          }
          if (String(metadata.controlWorkflowRefName ?? "") !== process.env.CANONICAL_CONTROL_BRANCH) {
            throw new Error("accepted bundle was not created from the canonical control branch");
          }
          if (metadata.verificationOnly === true) {
            throw new Error("verification-only package runs cannot be certified or promoted");
          }
          const output = [
            `candidate_sha=${String(metadata.candidateCommitSha ?? "")}`,
            `candidate_tree_sha=${String(metadata.candidateTreeSha ?? "")}`,
            `candidate_tag=${String(metadata.candidateTag ?? "")}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`, "utf8");
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.bundle_metadata.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Resolve immutable candidate and explicit tag binding
        id: candidate
        env:
          CANDIDATE_SHA: ${{ steps.bundle_metadata.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ steps.bundle_metadata.outputs.candidate_tree_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          sha="$(git -C candidate rev-parse HEAD)"
          tree_sha="$(git -C candidate rev-parse HEAD^{tree})"
          if [ "$sha" != "$CANDIDATE_SHA" ]; then
            echo "::error::Checked-out candidate SHA ${sha} does not match bundle metadata ${CANDIDATE_SHA}"
            exit 1
          fi
          if [ "$tree_sha" != "$CANDIDATE_TREE_SHA" ]; then
            echo "::error::Checked-out candidate tree ${tree_sha} does not match bundle metadata ${CANDIDATE_TREE_SHA}"
            exit 1
          fi
          git -C candidate fetch --force origin "refs/tags/${CANDIDATE_TAG}:refs/tags/${CANDIDATE_TAG}"
          tagged_sha="$(git -C candidate rev-parse "${CANDIDATE_TAG}^{commit}")"
          if [ "$tagged_sha" != "$CANDIDATE_SHA" ]; then
            echo "::error::candidate tag ${CANDIDATE_TAG} resolves to ${tagged_sha}, not ${CANDIDATE_SHA}"
            exit 1
          fi
          if printf '%s' "$CANDIDATE_TAG" | grep -q -- '-'; then prerelease=true; else prerelease=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE_TREE_SHA=$tree_sha" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"

      - name: Install accepted bundle into the immutable candidate checkout
        run: cp -R bundle/. candidate/

      - name: Checkout independent certification evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.certification_ref }}
          path: certification-source
          fetch-depth: 1

      - name: Install candidate-bound certification bundle
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          source_dir="certification-source/release-certifications/$CANDIDATE_TAG"
          if [ ! -d "$source_dir" ]; then
            echo "::error::Certification directory is missing: $source_dir"
            exit 1
          fi
          if find "$source_dir" -type l -print -quit | grep -q .; then
            echo "::error::Certification bundles may not contain symbolic links"
            exit 1
          fi
          mkdir -p candidate/artifacts/release/generated/certifications
          cp -R "$source_dir/." candidate/artifacts/release/generated/certifications/
          rm -rf certification-source

      - name: Fetch completed candidate package workflow metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          mkdir -p candidate/artifacts/release/generated/certifications
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > candidate/artifacts/release/generated/certifications/package-workflow-run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100" > candidate/artifacts/release/generated/certifications/package-workflow-jobs.json

      - name: Run certification preflight
        working-directory: candidate
        env:
          RELEASE_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_CANDIDATE_TREE_SHA: ${{ steps.candidate.outputs.tree_sha }}
          RELEASE_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: node ../scripts/check-release-preflight.mjs --mode certify --json

      - name: Enforce exact package, core, human, hardware, and platform evidence from control policy
        env:
          RELEASE_WORKFLOW_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_EVIDENCE_STATUS: ../docs/release/release-evidence-status.json
        working-directory: candidate
        run: node ../scripts/check-release-evidence.mjs

      - name: Upload certification decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certified-candidate-${{ inputs.candidate_tag }}
          path: candidate/artifacts/release/release-evidence-check.json
          if-no-files-found: ignore
          retention-days: 90

  github-release:
    name: Draft GitHub release from certified bytes
    needs: certify
    if: inputs.publish_github == true
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-candidate-bundle
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage promotion files from the accepted candidate bundle
        id: promotion
        env:
          CANDIDATE_SHA: ${{ needs.certify.outputs.candidate_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const workspaceRoot = process.cwd();
          const bundleRoot = path.resolve("bundle");
          const inventoryPath = path.resolve(bundleRoot, "artifacts", "release", "release-artifact-inventory.json");
          const promotionListPath = path.resolve(bundleRoot, "artifacts", "release", "promotion-files.txt");
          const promotionStagePath = path.resolve("release-artifacts", "promotion-files.txt");

          if (!fs.existsSync(inventoryPath)) {
            throw new Error("accepted candidate bundle is missing artifacts/release/release-artifact-inventory.json");
          }
          if (!fs.existsSync(promotionListPath)) {
            throw new Error("accepted candidate bundle is missing artifacts/release/promotion-files.txt");
          }

          const inventory = JSON.parse(fs.readFileSync(inventoryPath, "utf8"));
          const expectedFiles = Array.isArray(inventory.promotionFiles) ? inventory.promotionFiles : [];
          const listedFiles = fs.readFileSync(promotionListPath, "utf8").split(/\r?\n/).filter(Boolean);
          if (JSON.stringify(expectedFiles) !== JSON.stringify(listedFiles)) {
            throw new Error("promotion-files.txt does not exactly match release-artifact-inventory.json");
          }

          const seen = new Set();
          const stagedFiles = [];
          for (const relativePath of listedFiles) {
            if (path.isAbsolute(relativePath)) {
              throw new Error(`promotion file must be repository-relative: ${relativePath}`);
            }
            const normalized = relativePath.replaceAll("\\", "/");
            if (normalized !== path.posix.normalize(normalized) || normalized.startsWith("../") || normalized.includes("/../")) {
              throw new Error(`promotion file path is unsafe: ${relativePath}`);
            }
            if (!normalized.startsWith("release-artifacts/")) {
              throw new Error(`promotion file must stay under release-artifacts/: ${relativePath}`);
            }
            if (seen.has(normalized)) {
              throw new Error(`promotion file is duplicated: ${relativePath}`);
            }
            seen.add(normalized);
            const sourcePath = path.resolve(bundleRoot, normalized);
            const sourceRealPath = fs.realpathSync(sourcePath);
            if (!sourceRealPath.startsWith(bundleRoot + path.sep)) {
              throw new Error(`promotion file escapes the accepted bundle: ${relativePath}`);
            }
            const stat = fs.lstatSync(sourcePath);
            if (stat.isSymbolicLink()) {
              throw new Error(`promotion file must not be a symlink: ${relativePath}`);
            }
            if (!stat.isFile()) {
              throw new Error(`promotion file is not a regular file: ${relativePath}`);
            }
            const targetPath = path.resolve(workspaceRoot, normalized);
            fs.mkdirSync(path.dirname(targetPath), { recursive: true });
            fs.copyFileSync(sourcePath, targetPath);
            stagedFiles.push(normalized);
          }

          fs.mkdirSync(path.dirname(promotionStagePath), { recursive: true });
          fs.writeFileSync(promotionStagePath, `${stagedFiles.join("\n")}\n`, "utf8");
          NODE

      - name: Generate promotion provenance and checksums
        id: promotion_manifest
        env:
          CANDIDATE_SHA: ${{ needs.certify.outputs.candidate_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync("release-artifacts/build-manifest.json", JSON.stringify({product:"TalentScout",tag:process.env.CANDIDATE_TAG,commit:process.env.CANDIDATE_SHA,candidateWorkflowRun:process.env.CANDIDATE_RUN_ID,certificationWorkflowRun:process.env.GITHUB_RUN_ID,promotedAt:new Date().toISOString()}, null, 2)+"\n")'
          printf '%s\n' release-artifacts/build-manifest.json >> release-artifacts/promotion-files.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            sha256sum "$path"
          done < release-artifacts/promotion-files.txt > release-artifacts/SHA256SUMS.txt
          printf '%s\n' release-artifacts/SHA256SUMS.txt >> release-artifacts/promotion-files.txt
          {
            echo "files<<EOF"
            cat release-artifacts/promotion-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ inputs.candidate_tag }}
          draft: true
          prerelease: ${{ needs.certify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.promotion_manifest.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  steam-upload:
    name: Upload certified final depots to Steam
    needs: certify
    if: inputs.publish_steam == true && needs.certify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.certify.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Re-prove exact candidate and explicit tag binding
        env:
          CANDIDATE_SHA: ${{ needs.certify.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ needs.certify.outputs.candidate_tree_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          sha="$(git -C candidate rev-parse HEAD)"
          tree_sha="$(git -C candidate rev-parse HEAD^{tree})"
          if [ "$sha" != "$CANDIDATE_SHA" ] || [ "$tree_sha" != "$CANDIDATE_TREE_SHA" ]; then
            echo "::error::Steam upload candidate checkout does not match the certified SHA/tree"
            exit 1
          fi
          git -C candidate fetch --force origin "refs/tags/${CANDIDATE_TAG}:refs/tags/${CANDIDATE_TAG}"
          tagged_sha="$(git -C candidate rev-parse "${CANDIDATE_TAG}^{commit}")"
          if [ "$tagged_sha" != "$CANDIDATE_SHA" ]; then
            echo "::error::candidate tag ${CANDIDATE_TAG} no longer resolves to ${CANDIDATE_SHA}"
            exit 1
          fi

      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-candidate-bundle
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact Windows depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-windows
          path: candidate/dist/win-unpacked
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact macOS depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-macos
          path: candidate/steam-stage/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact Linux depot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam-linux
          path: candidate/dist/linux-unpacked
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Steam depots byte-for-byte against the accepted bundle inventory
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const inventoryPath = path.resolve("bundle", "artifacts", "release", "generated", "steam-depot-inventories.json");
          if (!fs.existsSync(inventoryPath)) {
            throw new Error("accepted candidate bundle is missing steam-depot-inventories.json");
          }
          const inventory = JSON.parse(fs.readFileSync(inventoryPath, "utf8"));
          if (!Array.isArray(inventory.depots) || inventory.depots.length !== 3) {
            throw new Error("steam depot inventory is incomplete");
          }

          function normalize(value) {
            return value.replaceAll("\\", "/");
          }

          function walk(rootPath) {
            const absoluteRoot = path.resolve("candidate", rootPath);
            const files = [];
            function visit(relativePath) {
              const absolutePath = path.resolve("candidate", relativePath);
              const stat = fs.lstatSync(absolutePath);
              if (stat.isSymbolicLink()) {
                throw new Error(`downloaded Steam depot contains a symlink: ${normalize(relativePath)}`);
              }
              if (stat.isDirectory()) {
                const entries = fs.readdirSync(absolutePath).sort((left, right) => left.localeCompare(right));
                for (const entry of entries) visit(path.join(relativePath, entry));
                return;
              }
              if (!stat.isFile()) {
                throw new Error(`downloaded Steam depot contains an unsupported entry: ${normalize(relativePath)}`);
              }
              const bytes = fs.readFileSync(absolutePath);
              files.push({
                path: normalize(relativePath),
                bytes: bytes.length,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
              });
            }
            visit(rootPath);
            return files;
          }

          for (const depot of inventory.depots) {
            const expectedFiles = Array.isArray(depot.files) ? depot.files : [];
            const actualFiles = walk(depot.rootPath);
            if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
              throw new Error(`Steam depot ${depot.artifactName} does not match the accepted byte inventory`);
            }
          }
          NODE

      - name: Run Steam promotion preflight
        working-directory: candidate
        env:
          RELEASE_CANDIDATE_SHA: ${{ needs.certify.outputs.candidate_sha }}
          RELEASE_CANDIDATE_TREE_SHA: ${{ needs.certify.outputs.candidate_tree_sha }}
          RELEASE_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: node ../scripts/check-release-preflight.mjs --mode promote-steam --json

      - name: Install SteamCmd
        run: |
          sudo apt-get update
          sudo apt-get install -y steamcmd

      - name: Configure Steam authentication
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "$STEAM_CONFIG_VDF" ]; then
            echo "::error::STEAM_CONFIG_VDF is required"
            exit 1
          fi
          mkdir -p "$HOME/.steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/.steam/config/config.vdf"

      - name: Upload unchanged certified depots
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          if [ -z "$STEAM_USERNAME" ]; then
            echo "::error::STEAM_USERNAME is required"
            exit 1
          fi
          steamcmd +login "$STEAM_USERNAME" \
            +run_app_build "$GITHUB_WORKSPACE/candidate/steamcmd/app_build_4455570.vdf" \
            +quit
